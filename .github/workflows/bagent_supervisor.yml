name: BAgent Quantitative Supervisor

on:
  push:
    branches: [ main ]
    paths:
      - 'portal/schedine.json'
      - 'data/active_user_tickets.json'
      - 'SNAPSHOT_OGGI.json'
      - 'data/daily_reality_snapshot.json'

jobs:
  supervise-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BAgent Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Reality & Roster Integrity
        run: |
          python scripts/daily_roster_coach_updater.py --verify-tickets || true

      - name: Run Gemini Git Supervisor & Quantitative Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/gemini_git_supervisor.py
