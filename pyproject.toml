[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagent"
description = "Quantitative football betting engine with Reality Gate, Dixon-Coles and portfolio rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "a502502502" }]
keywords = ["football", "betting", "dixon-coles", "quantitative", "reality-gate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.dynamic]
version = { attr = "bagent.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["analyzer*", "application*", "domain*", "services*", "utils*", "infrastructure*", "models*", "scraper*", "storage*", "tools*", "harness*"]
exclude = ["tests*", "scratch*", "docs*", "portal*", "web_mobile*", "reports*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=tests/test_scraper.py --ignore=tests/test_pipeline.py --ignore=tests/application/test_probility_engine.py"
