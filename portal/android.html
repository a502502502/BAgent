<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070d19">
<meta name="color-scheme" content="dark">
<title>BAgent Mobile — Schedine Certificate</title>
<style>
  :root {
    --bg: #070d19;
    --surface: #0f172a;
    --surface-elevated: #1e293b;
    --border: #22324e;
    --border-subtle: #1e293b;
    --primary: #38bdf8;
    --primary-bg: rgba(56, 189, 248, 0.12);
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.14);
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.14);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.14);
    --text-high: #f8fafc;
    --text-med: #94a3b8;
    --text-low: #64748b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg);
    color: var(--text-high);
    font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    min-height: 100dvh;
    padding-top: calc(var(--safe-top) + 64px);
    padding-bottom: calc(var(--safe-bottom) + 80px);
    overflow-x: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* TOP APP BAR */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: calc(var(--safe-top) + 64px);
    padding-top: var(--safe-top);
    background: rgba(7, 13, 25, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 16px;
    padding-right: 16px;
    z-index: 1000;
  }
  
  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-title {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: var(--text-high);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-title span { color: var(--primary); }
  .badge-live {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
    letter-spacing: 0.05em;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .profit-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    color: var(--success);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.1;
  }
  .profit-chip small {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-med);
  }
  
  .btn-icon {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-high);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s;
  }
  .btn-icon:active { transform: scale(0.92); background: var(--surface-elevated); }

  /* SEARCH & QUICK FILTERS */
  .sub-header {
    padding: 12px 16px 8px;
  }
  .search-box {
    position: relative;
    margin-bottom: 12px;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px 12px 40px;
    color: var(--text-high);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--primary); }
  .search-input::placeholder { color: var(--text-low); }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-low);
  }

  .filter-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-scroll::-webkit-scrollbar { display: none; }
  
  .filter-pill {
    white-space: nowrap;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-med);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-pill.active {
    background: var(--primary);
    color: #070d19;
    border-color: var(--primary);
  }

  /* LIST & TICKETS CONTAINER */
  .container {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* TICKET CARD */
  .ticket-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, border-color 0.15s;
  }
  .ticket-card:active { transform: scale(0.99); }
  
  .card-header {
    padding: 14px 16px;
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
    border-bottom: 1px solid var(--border-subtle);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-high);
    line-height: 1.3;
  }
  .odds-badge {
    background: var(--primary-bg);
    color: var(--primary);
    border: 1px solid rgba(56, 189, 248, 0.35);
    font-size: 16px;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .card-metrics {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-med);
    margin-top: 4px;
  }
  .metric-item b { color: var(--text-high); font-weight: 700; }
  .metric-pot b { color: var(--success); font-weight: 800; }

  /* LEGS */
  .card-legs {
    display: flex;
    flex-direction: column;
  }
  .leg-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .leg-row:last-child { border-bottom: none; }
  
  .leg-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-low);
    font-weight: 600;
  }
  .leg-match {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-high);
  }
  .leg-pick-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .pick-pill {
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.25);
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    flex: 1;
  }
  .odd-pill {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-high);
    padding: 4px 8px;
    background: var(--surface-elevated);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .leg-notes {
    font-size: 11px;
    color: var(--text-med);
    line-height: 1.35;
  }
  
  .leg-status {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .status-pending { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
  .status-won { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
  .status-lost { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }

  /* CARD ACTIONS */
  .card-footer {
    padding: 10px 16px;
    background: rgba(15, 23, 42, 0.7);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn-share {
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-high);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-share:active { transform: scale(0.95); }

  /* BOTTOM NAVIGATION BAR (MATERIAL 3) */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--safe-bottom) + 64px);
    padding-bottom: var(--safe-bottom);
    background: rgba(7, 13, 25, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 100%;
    color: var(--text-low);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.15s;
    position: relative;
  }
  .nav-item.active {
    color: var(--primary);
  }
  .nav-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
  .nav-badge {
    position: absolute;
    top: 8px;
    right: calc(50% - 18px);
    background: var(--primary);
    color: #070d19;
    font-size: 9px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 999px;
  }

  /* TOAST NOTIFICATION */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 76px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid var(--primary);
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 2000;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-med);
  }
  .empty-state h3 { font-size: 16px; color: var(--text-high); margin-bottom: 6px; }

  /* SPIN ANIMATION */
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>

    icon.classList.add('spin');
    try {
      const res = await fetch('schedine.json?t=' + Date.now());
      if (res.ok) {
        DB = await res.json();
        showToast("Dati aggiornati!");
      }
    } catch (e) {
      console.log("Offline mode, using cached boot data");
    } finally {
      setTimeout(() => icon.classList.remove('spin'), 400);
      render();
    }
  }

  function filterTicket(t) {
    const title = (t.title || '').toLowerCase();
    const legs = t.legs || [];
    
    // Category filter
    if (currentCat === 'core') {
      if (!title.includes('core')) return false;
    } else if (currentCat === 'tiri') {
      if (!title.includes('chirurgica') && !title.includes('balistica') && !title.includes('tiri') && !title.includes('corner')) return false;
    } else if (currentCat === 'uecl') {
      if (!title.includes('uecl') && !title.includes('conference')) return false;
    } else if (currentCat === 'satellite') {
      if (!title.includes('satellite') && !title.includes('specials')) return false;
    }

    // Search query filter
    if (searchQuery.trim() !== '') {
      const q = searchQuery.toLowerCase();
      const matchInTitle = title.includes(q);
      const matchInLegs = legs.some(l => 
        (l.match || '').toLowerCase().includes(q) ||
        (l.pick || '').toLowerCase().includes(q) ||
        (l.score || '').toLowerCase().includes(q)
      );
      if (!matchInTitle && !matchInLegs) return false;
    }

    return true;
  }

  function copyTicket(t) {
    haptic();
    let text = `${t.title}
`;
    text += `Quota Totale: ${t.odds || ''} | Stake: ${t.stake || ''} | Vincita Pot: ${t.potential_win || ''}

`;
    (t.legs || []).forEach((l, idx) => {
      text += `${idx + 1}) ${l.match} (${l.when || ''})
   👉 Giocata: ${l.pick} @ ${l.odd}
`;
    });
    text += `
Certificato BAgent Reality Gate 2026/27`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Schedina copiata!");
      });
    } else {
      showToast("Condivisione non supportata");
    }
  }

  function render() {
    if (!DB) return;

    // Header profit
    const pEl = document.getElementById('profit-val');
    if (pEl && DB.profit_label) {
      pEl.innerText = DB.profit_label.split('(')[0].trim();
    }

    // Badge present count
    const presentList = DB.present || [];
    document.getElementById('badge-present').innerText = presentList.length;
    document.getElementById('count-all').innerText = presentList.length;

    // Select target list
    let list = DB[currentTab] || [];
    list = list.filter(filterTicket);

    const container = document.getElementById('tickets-container');
    container.innerHTML = '';

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>Nessuna schedina trovata</h3>
          <p>Nessun ticket corrisponde ai filtri selezionati.</p>
        </div>
      `;
      return;
    }

    list.forEach(t => {
      const card = document.createElement('div');
      card.className = 'ticket-card';

      let legsHtml = '';
      (t.legs || []).forEach(l => {
        let statusClass = 'status-pending';
        let statusLabel = 'In Attesa';
        if (l.result === 'WON') { statusClass = 'status-won'; statusLabel = 'Vinta'; }
        else if (l.result === 'LOST') { statusClass = 'status-lost'; statusLabel = 'Persa'; }

        legsHtml += `
          <div class="leg-row">
            <div class="leg-top">
              <span>${l.when || 'Oggi'}</span>
              <span class="leg-status ${statusClass}">${statusLabel}</span>
            </div>
            <div class="leg-match">${l.match}</div>
            <div class="leg-pick-row">
              <div class="pick-pill">${l.pick}</div>
              <div class="odd-pill">@ ${l.odd}</div>
            </div>
            <div class="leg-notes">${l.score || ''}</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="card-header">
          <div class="card-top">
            <div class="card-title">${t.title}</div>
            <div class="odds-badge">${t.odds || ''}</div>
          </div>
          <div class="card-metrics">
            <span class="metric-item">Stake: <b>${t.stake || ''}</b></span>
            <span class="metric-pot">Vincita: <b>${t.potential_win || ''}</b></span>
          </div>
        </div>
        <div class="card-legs">
          ${legsHtml}
        </div>
        <div class="card-footer">
          <span style="font-size:11px;color:var(--text-low);">${t.label || ''}</span>
          <button class="btn-share" data-id="${t.id}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            Copia
          </button>
        </div>
      `;

      card.querySelector('.btn-share').addEventListener('click', (e) => {
        e.stopPropagation();
        copyTicket(t);
      });

      container.appendChild(card);
    });
  }

  // Event Listeners
  document.addEventListener('DOMContentLoaded', () => {
    parseBoot();
    render();

    // Refresh button
    document.getElementById('btn-refresh').addEventListener('click', () => {
      haptic();
      fetchLive();
    });

    // Search input
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Category pills
    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        haptic();
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.getAttribute('data-cat');
        render();
      });
    });

    // Bottom nav tabs
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        haptic();
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentTab = item.getAttribute('data-tab');
        render();
      });
    });

    // Auto-refresh every 25 seconds if online
    setInterval(() => {
      if (document.visibilityState === 'visible') {
        fetchLive();
      }
    }, 25000);
  });
</script>
</body>
</html>
