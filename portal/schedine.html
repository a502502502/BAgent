<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAgent — Archivio schedine</title>
<style>
  :root { --bg:#070d19; --card:#111c30; --line:#1e293b; --text:#f8fafc; --muted:#94a3b8; --blue:#38bdf8; --green:#10b981; --yellow:#f59e0b; --red:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:980px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0; }
  header { display:flex; justify-content:space-between; gap:12px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:110px; }
  .stat b { display:block; font-size:16px; }
  nav { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px; }
  nav button { background:#0f172a; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:10px 6px; font-weight:700; cursor:pointer; }
  nav button.on { background:#1e293b; color:var(--text); border-color:var(--yellow); }
  nav button b { display:block; font-size:18px; color:var(--blue); }
  #check { color:var(--muted); font-size:12px; min-height:18px; margin:0 0 12px; }
  #check.ok { color:var(--green); }
  #check.bad { color:var(--red); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 12px; }
  .top { display:flex; justify-content:space-between; gap:8px; }
  .odd { font-size:20px; font-weight:800; color:var(--blue); }
  .meta { color:var(--muted); font-size:12px; margin:6px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:6px 0; border-top:1px solid var(--line); vertical-align:top; }
  .pick { color:var(--blue); }
  .Vinta { color:var(--green); } .Persa { color:var(--red); } .Futura, .In, .corso, .Attesa { color:var(--yellow); }
  .semaforo { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
  .semaforo-won { background:rgba(34,197,94,0.15); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
  .semaforo-lost { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
  .semaforo-pending { background:rgba(234,179,8,0.15); color:var(--yellow); border:1px solid rgba(234,179,8,0.3); }
  .semaforo-lineup { background:rgba(56,189,248,0.15); color:var(--blue); border:1px solid rgba(56,189,248,0.3); }
  .semaforo-void { background:rgba(148,163,184,0.15); color:var(--muted); border:1px solid rgba(148,163,184,0.3); }
  .booking-badge { margin:8px 0 4px; padding:8px 10px; border:1px solid var(--yellow); border-radius:8px; background:#1e293b; color:var(--yellow); font-size:14px; }
  .booking-badge strong { color:var(--text); font-size:18px; letter-spacing:0.12em; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Archivio schedine</h1>
      <p id="generated">Caricamento</p>
    </div>
    <div class="stat">P/L chiuso<b id="profit">—</b></div>
  </header>
  <nav>
    <button type="button" data-section="present" class="on">Presenti <b id="n-present">0</b></button>
    <button type="button" data-section="future">Future <b id="n-future">0</b></button>
    <button type="button" data-section="past">Passate <b id="n-past">0</b></button>
  </nav>
  <p id="check">Controllo ogni 30 secondi</p>
  <section id="list"></section>
</main>
<script type="application/json" id="boot">{"generated_at": "2026-10-12T11:12:03.379837", "check_seconds": 30, "profit_label": "0.00 €", "present": [{"id": "TICKET_USER_MULTIPLA5_MATTINA_10EUR_12OTT", "title": "Schedina Reale Utente: Multipla (5) Primo Pomeriggio (@ 6.66)", "label": "In corso", "stake": "10.00 €", "odds": "6.66×", "booking_code": null, "legs": [{"when": "10-12 12:00", "match": "Fardu Ferghana vs FC Kattaqorgon", "pick": "1X2: 1", "odd": "1.44", "result": "PENDING", "score": "0-0"}, {"when": "10-12 12:00", "match": "FC Livyi Bereh Kyiv vs Zorya Luhansk", "pick": "X2 + Under 3.5", "odd": "1.9", "result": "PENDING", "score": "0-0"}, {"when": "10-12 13:00", "match": "FK Vojvodina Novi Sad vs FK Jedinstvo Ub", "pick": "1X2: 1", "odd": "1.31", "result": "PENDING", "score": "0-0"}, {"when": "10-12 13:30", "match": "Hougang United FC vs Balestier Khalsa FC", "pick": "Over 2.5", "odd": "1.31", "result": "PENDING", "score": "0-0"}, {"when": "10-12 13:45", "match": "Panionios vs PAOK Thessaloniki B", "pick": "1X + Under 3.5", "odd": "1.42", "result": "PENDING", "score": "0-0"}]}, {"id": "TICKET_12OTT_CORE_ROCKET", "title": "Schedina 1: Il Core Rocket (Lunedì 12 Ottobre)", "label": "In corso", "stake": "25.00 €", "odds": "2.58×", "booking_code": null, "legs": [{"when": "10-12 18:30", "match": "Atalanta vs Venezia", "pick": "Combo: 1X + Under 4.5", "odd": "1.36", "result": "PENDING", "score": ""}, {"when": "10-12 19:00", "match": "Malmo FF vs Kalmar", "pick": "Combo: 1X + MultiGol 1-5", "odd": "1.32", "result": "PENDING", "score": ""}, {"when": "10-12 20:45", "match": "Torino vs Udinese", "pick": "MultiGol Tempi: 0-2 1°T + 1-3 2°T", "odd": "1.44", "result": "PENDING", "score": ""}]}, {"id": "TICKET_12OTT_SATELLITE_MINORI", "title": "Schedina 2: Il Satellite Moltiplicatore Minori (Lunedì 12 Ottobre)", "label": "In corso", "stake": "7.00 €", "odds": "6.06×", "booking_code": null, "legs": [{"when": "10-12 14:00", "match": "Real Valladolid vs Albacete", "pick": "Combo: 1X + Under 3.5", "odd": "1.48", "result": "PENDING", "score": ""}, {"when": "10-12 18:00", "match": "Al Wasl vs Al Ahli SC", "pick": "Combo: X2 + Over 1.5", "odd": "1.45", "result": "PENDING", "score": ""}, {"when": "10-12 20:00", "match": "Universitatea Cluj vs Rapid Bucuresti", "pick": "Chance Mix: X o Gol", "odd": "1.44", "result": "PENDING", "score": ""}, {"when": "10-12 20:30", "match": "Pescara vs Guidonia", "pick": "Combo: 1X + Under 3.5", "odd": "1.38", "result": "PENDING", "score": ""}, {"when": "10-12 21:00", "match": "Coventry vs Newcastle", "pick": "Combo: X2 + Under 4.5", "odd": "1.42", "result": "PENDING", "score": ""}]}], "future": [], "past": []}</script>
<script>
const EMPTY = {
  present: "Nessuna schedina in corso.",
  future: "Nessuna schedina con kickoff ancora davanti.",
  past: "Nessuna schedina chiusa in archivio."
};
let data = JSON.parse(document.getElementById("boot").textContent);
let section = "present";
let left = 30;
const list = document.getElementById("list");
const check = document.getElementById("check");

function text(tag, value, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.textContent = value || "";
  return node;
}

function card(slip) {
  const art = document.createElement("article");
  art.className = "card";
  const top = document.createElement("div");
  top.className = "top";
  const title = document.createElement("div");
  title.appendChild(text("strong", slip.title));
  const meta = text("div", (slip.id || "") + " · " + (slip.label || ""), "meta");
  meta.className = "meta " + (slip.label || "").split(" ")[0];
  title.appendChild(meta);
  top.appendChild(title);
  top.appendChild(text("div", slip.odds || "—", "odd"));
  art.appendChild(top);
  if (slip.booking_code) {
    const booking = document.createElement("div");
    booking.className = "booking-badge";
    booking.appendChild(document.createTextNode("Prenotazione: "));
    const code = document.createElement("strong");
    code.textContent = slip.booking_code;
    booking.appendChild(code);
    art.appendChild(booking);
  }
  art.appendChild(text("div", "Stake " + (slip.stake || "—"), "meta"));
  const table = document.createElement("table");
  (slip.legs || []).forEach(function (leg) {
    const row = document.createElement("tr");
    row.appendChild(text("td", leg.when || "—"));
    const match = document.createElement("td");
    match.appendChild(document.createTextNode(leg.match || ""));
    match.appendChild(text("div", leg.pick || "", "pick"));
    row.appendChild(match);
    row.appendChild(text("td", leg.odd || "—"));
    const semTd = document.createElement("td");
    semTd.style.textAlign = "right";
    const badge = document.createElement("span");
    const st = (leg.result || "").toUpperCase();
    if (st === "WON" || st === "VINTA" || st === "PRESA") {
      badge.className = "semaforo semaforo-won";
      badge.textContent = "Presa" + (leg.score ? " (" + leg.score + ")" : "");
    } else if (st === "LOST" || st === "PERSA") {
      badge.className = "semaforo semaforo-lost";
      badge.textContent = "Persa" + (leg.score ? " (" + leg.score + ")" : "");
    } else if (st === "VOID" || st === "RIMBORSO") {
      badge.className = "semaforo semaforo-void";
      badge.textContent = "Void";
    } else if (st === "WAITING_LINEUPS" || st === "ATTESA FORMAZIONI") {
      badge.className = "semaforo semaforo-lineup";
      badge.textContent = "Attesa formazioni (T-60m)";
    } else {
      badge.className = "semaforo semaforo-pending";
      badge.textContent = "In attesa" + (leg.score ? " (" + leg.score + ")" : "");
    }
    semTd.appendChild(badge);
    row.appendChild(semTd);
    table.appendChild(row);
  });
  art.appendChild(table);
  return art;
}

function render() {
  ["present", "future", "past"].forEach(function (name) {
    document.getElementById("n-" + name).textContent = String((data[name] || []).length);
  });
  document.getElementById("profit").textContent = data.profit_label || "—";
  document.getElementById("generated").textContent = "Dati del " + (data.generated_at || "—");
  document.querySelectorAll("button[data-section]").forEach(function (button) {
    button.classList.toggle("on", button.getAttribute("data-section") === section);
  });
  list.replaceChildren();
  const rows = data[section] || [];
  if (!rows.length) {
    list.appendChild(text("p", EMPTY[section], "meta"));
    return;
  }
  rows.forEach(function (slip) { list.appendChild(card(slip)); });
}

function stamp() {
  return new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function refresh() {
  try {
    const response = await fetch("schedine.json?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    data = await response.json();
    render();
    check.className = "ok";
    check.textContent = "Ultimo controllo " + stamp() + " · prossimo tra " + left + "s";
  } catch (error) {
    check.className = "bad";
    check.textContent = "Controllo non riuscito alle " + stamp() + " · nuovo tentativo tra " + left + "s";
  }
}

document.querySelectorAll("button[data-section]").forEach(function (button) {
  button.addEventListener("click", function () {
    section = button.getAttribute("data-section");
    render();
  });
});
render();
refresh();
setInterval(function () {
  left -= 1;
  if (left <= 0) {
    left = data.check_seconds || 30;
    refresh();
    return;
  }
  const failed = check.className === "bad";
  check.textContent = (failed ? "Controllo non riuscito" : "Ultimo controllo ok") + " · prossimo tra " + left + "s";
}, 1000);
</script>
</body>
</html>
